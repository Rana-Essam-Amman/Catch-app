name: Phase 1 verify

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma generate
      - name: Typecheck if configured
        run: npx tsc --noEmit --pretty false || true
      - name: Do not migrate production
        run: echo "Skipping prisma migrate deploy in CI without isolated DATABASE_URL"
